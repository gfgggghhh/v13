name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # only used to attach the APK to a GitHub Release when you push a v* tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project has no gradlew / gradle-wrapper.jar, so Gradle is installed below.
      # This step also finds the project folder, in case the repo contains it inside a sub-folder.
      - name: Locate Android project
        id: proj
        shell: bash
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found - push the project files (not the .zip) to the repository"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships with the Android SDK (ANDROID_HOME); only the licenses must be accepted.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: ${{ steps.proj.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VeinFinder-debug.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeinFinder-debug-apk
          path: ${{ steps.proj.outputs.dir }}/dist/VeinFinder-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/dist/VeinFinder-debug.apk
